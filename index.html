<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>점심 뭐 먹지</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="gnb">
      <h1 class="gnb__title text-title">점심 뭐 먹지</h1>
      <button type="button" class="gnb__add-button" aria-label="음식점 추가">
        <img src="./images/add-button.png" alt="음식점 추가" />
      </button>
    </header>
    <main class="tabs">
      <div class="tab-buttons">
        <button class="tab-button active" data-tab="list">모든 음식점</button>
        <button class="tab-button" data-tab="favorite">자주 가는 음식점</button>
      </div>

      <section class="tab-content active" id="list">
        <section class="restaurant-filter-container">
          <select
            name="category"
            id="category-filter"
            class="restaurant-filter"
          >
            <option value="전체">전체</option>
            <option value="한식">한식</option>
            <option value="중식">중식</option>
            <option value="일식">일식</option>
            <option value="양식">양식</option>
            <option value="아시안">아시안</option>
            <option value="기타">기타</option>
          </select>

          <select name="sorting" id="sorting-filter" class="restaurant-filter">
            <option value="name">이름순</option>
            <option value="distance">거리순</option>
          </select>
        </section>

        <section class="restaurant-list-container">
          <ul class="restaurant-list"></ul>
        </section>
      </section>

      <section class="tab-content" id="favorite">
        <section class="restaurant-list-container">
          <ul class="restaurant-list"></ul>
        </section>
      </section>
    </main>
    <script type="module" src="./src/index.js"></script>
  </body>
</html>
